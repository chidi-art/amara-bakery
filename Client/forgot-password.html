<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Amara's Bakery</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="auth-brand">
          <span>Amara's</span><strong>Bakery</strong>
        </div>
        <p>Fresh loaves, sweet treats, and warm service.</p>
      </div>
      <main class="auth-card" role="main">
        <div class="auth-card-content">
          <h1 class="auth-title">Reset password</h1>
          <p class="auth-copy">
            Enter your email and we will send you a reset link.
          </p>
          <form class="auth-form" id="forgotPasswordForm" novalidate>
            <div class="auth-field">
              <label for="email" class="sr-only">Email</label>
              <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
              />
            </div>
            <button type="submit" class="auth-button">Send reset link</button>
            <p
              class="validation-message"
              id="validationMessage"
              aria-live="polite"
            ></p>
          </form>
          <p class="auth-copy">
            <a href="login.html" class="auth-link">Back to login</a>
          </p>
        </div>
      </main>
    </div>
    <script src="./js/password-reset.js"></script>
  </body>
</html>
