<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password | Amara's Bakery</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="auth-brand">
          <span>Amara's</span><strong>Bakery</strong>
        </div>
        <p>Fresh loaves, sweet treats, and warm service.</p>
      </div>
      <main class="auth-card" role="main">
        <div class="auth-card-content">
          <h1 class="auth-title">Set new password</h1>
          <form class="auth-form" id="resetPasswordForm" novalidate>
            <div class="auth-field">
              <label for="password" class="sr-only">New password</label>
              <input
                type="password"
                id="password"
                placeholder="New password"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="auth-field">
              <label for="confirmPassword" class="sr-only"
                >Confirm password</label
              >
              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                autocomplete="new-password"
                required
              />
            </div>
            <button type="submit" class="auth-button">Update password</button>
            <p
              class="validation-message"
              id="validationMessage"
              aria-live="polite"
            ></p>
          </form>
          <p class="auth-copy">
            <a href="login.html" class="auth-link">Back to login</a>
          </p>
        </div>
      </main>
    </div>
    <script src="./js/password-reset.js"></script>
  </body>
</html>
