<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Bree+Serif&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details</title>

  <body class="product-page">
    <nav class="navbar">
      <ul class="navlinks">
        <li><a href="Home.html">Home</a></li>
        <li><a href="Menu.html">Menu</a></li>
        <li><a href="contactus.html">Contact</a></li>
        <li><a href="Cart.html" class="cart-link">Cart</a></li>
      </ul>
      <div class="nav-user">
        <div class="user-icon" aria-label="User account"></div>
      </div>
    </nav>

    <div class="product-body">
      <a class="product-exit" href="Menu.html" aria-label="Return to menu"
        >&times;</a
      >
      <div class="product-image">
        <img
          class="product-img"
          src="./Images/products/IMG_0979.JPG"
          alt="Chocolate fudge bread"
        />
      </div>
      <div class="product-txt-container">
        <div class="product-txt-info">
          <span class="product-name">Chocolate Fudge Bread</span>
          <span class="product-price">12kr</span>
          <span class="product-desc"
            >Delicious cacao bread with fudge filling</span
          >
        </div>
        <div class="product-btns">
          <div class="product-qty">
            <button class="qty-btn minus-btn">−</button>
            <input type="number" value="0" min="0" max="10" readonly />
            <button class="qty-btn plus-btn">+</button>
          </div>
          <a class="add-to-cart" href="#"> Add to Cart</a>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer-container">
        <div class="footer-brand">
          <h2>Amara's Menu</h2>
          <p>Made with love</p>
        </div>
        <div class="footer-links">
          <h3>Quick Links</h3>
          <a href="Home.html">Home</a>

          <a href="Home.html">Home</a>
          <a href="Menu.html">Menu</a>
          <a href="contactus.html">Contact</a>

        <div class="footer-end">
          <p>&copy; 2026 Amara's Menu. All rights reserved</p>
        </div>
      </div>

    <script src="./js/main.js"></script>
